[project]
name = "voicesync-ml-pipeline"
version = "0.1.0"
description = "VoiceSync — ML training pipeline"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tflite-support>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]