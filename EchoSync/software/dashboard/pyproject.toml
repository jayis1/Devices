# EchoSync Cloud Dashboard — Python dependencies
[project]
name = "echosync-dashboard"
version = "1.0.0"
description = "EchoSync AI-Powered Sound Awareness System — Cloud Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "paho-mqtt>=2.0",
    "asyncpg>=0.29",
    "influxdb-client>=1.42",
    "pydantic>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]