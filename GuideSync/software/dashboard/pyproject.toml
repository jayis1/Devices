[project]
name = "guidesync-dashboard"
version = "1.0.0"
description = "GuideSync Cloud Backend — FastAPI + MQTT + InfluxDB + PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "paho-mqtt>=2.0",
    "python-jose[cryptography]>=3.3",
    "psycopg2-binary>=2.9",
    "influxdb-client>=1.41",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]