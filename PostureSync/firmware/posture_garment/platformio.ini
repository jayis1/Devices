; PlatformIO config for Posture Garment
; Target: nRF52840 + ADS1298

[env:posture_garment]
platform = nordicnrf52
board = nrf52840_dk
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DPOSTSYNC_POSTURE_GARMENT=1
    -DNRF52840=1

lib_deps =
    ble-sdk-arduino
    bblanchon/ArduinoJson @ ^6.21