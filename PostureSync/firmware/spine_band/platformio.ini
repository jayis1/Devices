; PlatformIO config for Spine Band
; Target: nRF52840

[env:spine_band]
platform = nordicnrf52
board = nrf52840_dk
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DPOSTSYNC_SPINE_BAND=1
    -DNRF52840=1
    -DNRF52_S140=1

lib_deps =
    ble-sdk-arduino
    bblanchon/ArduinoJson @ ^6.21