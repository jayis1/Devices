; PlatformIO config for Desk Sentinel
; Target: RP2040 + ESP32-C3

[env:desk_sentinel]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DPOSTSYNC_DESK_SENTINEL=1

lib_deps =
    bblanchon/ArduinoJson @ ^6.21