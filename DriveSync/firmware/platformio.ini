# DriveSync — Build Configuration
#
# Hub:      ESP32-S3 via ESP-IDF (see hub/CMakeLists.txt)
# Wheel:    nRF52840 via PlatformIO + Arduino-Python framework
# Belt:     nRF52840 via PlatformIO
# OBD-II:   RP2040 via Pico SDK (see obd-dongle/CMakeLists.txt)

[platformio]
default_envs = wheel_node, belt_tag

# ── Steering Wheel Node (nRF52840) ──────────────────────────────────
[env:wheel_node]
platform = nordicnrf52
board = nrf52840_dk
framework = baremetal
build_flags =
    -DSOFTDEVICE_PRESENT
    -DS140
    -I../common
extra_scripts = pre:tools/softdevice.py

# ── Seat Belt Tag (nRF52840) ────────────────────────────────────────
[env:belt_tag]
platform = nordicnrf52
board = nrf52840_dk
framework = baremetal
build_flags =
    -DSOFTDEVICE_PRESENT
    -DS140
    -I../common
extra_scripts = pre:tools/softdevice.py

# ── Hub (ESP32-S3) — reference only, built with ESP-IDF ─────────────
[env:hub_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
build_flags =
    -I../common
monitor_speed = 115200

# ── OBD-II Dongle (RP2040) — reference only, built with Pico SDK ────
[env:obd_pico]
platform = raspberrypi
board = pico
framework = baremetal
build_flags =
    -I../common