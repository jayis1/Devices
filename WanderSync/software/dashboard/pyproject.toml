[project]
name = "wandersync-dashboard"
version = "1.0.0"
description = "WanderSync — Cloud Backend (FastAPI + MQTT + InfluxDB + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "paho-mqtt>=2.0.0",
    "asyncpg>=0.29.0",
    "influxdb-client>=1.40.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "ruff>=0.3.0"]