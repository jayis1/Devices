[project]
name = "wandersync-ml-pipeline"
version = "1.0.0"
description = "WanderSync — 7-model ML pipeline for dementia care intelligence"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "tflite-support>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.3.0", "tensorboard>=2.16.0"]