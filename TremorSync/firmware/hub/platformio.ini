; TremorSync Hub — PlatformIO config
[env:hub]
platform          = espressif32
board             = esp32-s3-devkitc-1
framework         = espidf
monitor_speed     = 115200
upload_speed      = 921600
build_flags =
    -DCONFIG_MQTT_BROKER_URI=\"mqtts://broker.tremorsync.cloud:8883\"
    -DTREMORSYNC_HUB=1
lib_deps =
    knolleary/PubSubClient @ ^2.8
extra_scripts    = pre:./build_extra.py