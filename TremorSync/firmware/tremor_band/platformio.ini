; TremorSync Tremor Band — PlatformIO config
[env:tremor_band]
platform          = nordicnrf52
board             = nrf52840_dk
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600
build_flags =
    -DTREMORSYNC_TREMOR_BAND=1
    -DNRF52_SERIES=NRF52840
    -DNRF52840_XXAA
lib_deps =
    adafruit/Adafruit ICM20X @ ^2.0.0
    adafruit/Adafruit DRV2605 Library @ ^1.2.0
    adafruit/Adafruit MAX3010X Library @ ^1.2.1
    adafruit/Adafruit TMP117 @ ^1.0.0