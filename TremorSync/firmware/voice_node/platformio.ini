; TremorSync Voice Node — PlatformIO config
[env:voice_node]
platform          = espressif32
board             = esp32-s3-devkitc-1
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600
build_flags =
    -DTREMORSYNC_VOICE_NODE=1
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.0
    adafruit/Adafruit MAX17048 @ ^1.0.0