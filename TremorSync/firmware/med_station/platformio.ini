; TremorSync Med Station — PlatformIO config
[env:med_station]
platform          = espressif32
board             = esp32-s3-devkitc-1
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600
build_flags =
    -DTREMORSYNC_MED_STATION=1
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.0
    adafruit/Adafruit HX711 @ ^1.0.0
    adafruit/Adafruit AS5600 @ ^1.0.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    jgromes/SX1262 @ ^1.0.0