; TremorSync Gait Pod — PlatformIO config
[env:gait_pod]
platform          = nordicnrf52
board             = nrf52840_dk
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600
build_flags =
    -DTREMORSYNC_GAIT_POD=1
    -DNRF52_SERIES=NRF52840
lib_deps =
    adafruit/Adafruit ICM20X @ ^2.0.0
    jgromes/SX1262 @ ^1.0.0