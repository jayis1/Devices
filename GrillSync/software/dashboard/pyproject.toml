# GrillSync — Cloud Dashboard Backend
# FastAPI + MQTT + InfluxDB + PostgreSQL
#
# Run: pip install -e . && uvicorn main:app --host 0.0.0.0 --port 8000

[project]
name = "grillsync-dashboard"
version = "1.0.0"
description = "GrillSync Cloud Backend — FastAPI + MQTT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "asyncpg>=0.29.0",
    "influxdb-client>=1.38.0",
    "paho-mqtt>=1.6.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.25.0",
    "orjson>=3.9.0",
]