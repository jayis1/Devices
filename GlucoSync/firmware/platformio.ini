# GlucoSync Firmware Build Configuration
#
# Hub + Meal Scanner: ESP-IDF (ESP32-S3)
# Activity Band + Pen Tag: PlatformIO (nRF52840)

[platformio]
default_envs = activity_band, pen_tag

[env]
platform = nordicnrf52
framework = nordic-sdk
board = nrf52840dk
build_flags =
    -DGLUCOSYNC_FIRMWARE
    -DSOFTDEVICE_S140
    -DBOARD_CUSTOM
lib_deps =
    nrf_sdk
build_type = release

[env:activity_band]
build_flags =
    ${env.build_flags}
    -DGLUCOSYNC_NODE_TYPE=2
    -DGS_NODE_NAME=\"activity_band\"
extra_scripts = pre:scripts/pre_activity_band.py

[env:pen_tag]
build_flags =
    ${env.build_flags}
    -DGLUCOSYNC_NODE_TYPE=3
    -DGS_NODE_NAME=\"pen_tag\"
extra_scripts = pre:scripts/pre_pen_tag.py