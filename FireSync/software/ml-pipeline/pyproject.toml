[project]
name = "firesync-ml-pipeline"
version = "1.0.0"
description = "FireSync ML training pipeline — 6 models for home fire safety"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "tensorflow>=2.16",
    "tflite-micro>=1.0",
    "onnxruntime>=1.17",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "hmmlearn>=0.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest", "tensorboard", "wandb"]