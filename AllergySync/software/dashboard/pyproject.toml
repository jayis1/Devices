[project]
name = "allergysync-dashboard"
version = "1.0.0"
description = "AllergySync cloud backend — FastAPI + MQTT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiomqtt>=2.0.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.0.0",
    "structlog>=24.0.0",
    "pydantic>=2.0.0",
    "websockets>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]