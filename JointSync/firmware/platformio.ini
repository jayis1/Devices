; JointSync Firmware — PlatformIO Configuration
;
; Build with: pio run -e <environment>
; Upload with: pio run -e <environment> -t upload

[platformio]
default_envs = hub

; ── Common ────────────────────────────────────────────────────────

[env]
monitor_speed = 115200

; ── Hub (ESP32-S3) ─────────────────────────────────────────────────

[env:hub]
platform = espressif32
board = esp32s3box
framework = espidf
build_flags =
    -DJOINTSYNC_HUB=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    ESP-IDF tflite-micro
upload_speed = 921600

; ── Joint Tag (nRF52840) ──────────────────────────────────────────

[env:joint-tag]
platform = nordicnrf52
board = nrf52840dk
framework = arduino
build_flags =
    -DJOINTSYNC_TAG=1
    -DNRF52840_XXAA
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    nordic/nRF5 SDK
upload_speed = 115200

; ── Compression Sleeve (ESP32-S3) ─────────────────────────────────

[env:compression-sleeve]
platform = espressif32
board = esp32s3box
framework = espidf
build_flags =
    -DJOINTSYNC_SLEEVE=1
    -DCORE_DEBUG_LEVEL=3
upload_speed = 921600

; ── Joint Scanner (ESP32-S3) ──────────────────────────────────────

[env:joint-scanner]
platform = espressif32
board = esp32s3box
framework = espidf
build_flags =
    -DJOINTSYNC_SCANNER=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    esp32-camera
upload_speed = 921600