# LawnSync Cloud Dashboard Backend
# FastAPI + MQTT + InfluxDB + PostgreSQL
#
# Run: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

[project]
name = "lawnsync-dashboard"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "asyncpg>=0.29",
    "influxdb-client>=1.41",
    "paho-mqtt>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "websockets>=12.0",
    "numpy>=1.26",
    "pillow>=10.2",
    "onnxruntime>=1.17",
]