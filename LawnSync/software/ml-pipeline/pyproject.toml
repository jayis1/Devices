# LawnSync ML Pipeline
# 6-model ML pipeline for lawn health intelligence

[project]
name = "lawnsync-ml"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pillow>=10.2",
    "matplotlib>=3.8",
    "albumentations>=1.4",
    "tflite-runtime>=2.14; platform_machine == 'aarch64'",
    "gymnasium>=0.29",
]