version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sightsync:sightsync@db:5432/sightsync
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - db
      - mosquitto
    restart: unless-stopped

  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_DB=sightsync
      - POSTGRES_USER=sightsync
      - POSTGRES_PASSWORD=sightsync
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
    environment:
      - MINIO_ROOT_USER=sightsync
      - MINIO_ROOT_PASSWORD=sightsync123
    command: server /data
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  timescale_data:
  minio_data: