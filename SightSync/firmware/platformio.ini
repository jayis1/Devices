; License: MIT

[platformio]
default_envs = hub

[common]
build_flags =
  -DSS_PROTOCOL_VERSION=1
  -Wall -Wextra
monitor_speed = 115200

; ── Vision Hub (ESP32-S3) ──────────────────────────────────────────
[env:hub]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
build_flags =
  ${common.build_flags}
  -DSS_NODE_HUB=1
  -DSS_NODE_NAME=\"hub\"
lib_deps =
  adafruit/Adafruit SSD1306 @ ^2.5.0
  adafruit/Adafruit GFX Library @ ^1.11.0
  adafruit/Adafruit BusIO @ ^1.14.0
  adafruit/Adafruit BMP3XX @ ^1.1.0
  adafruit/Adafruit DRV2605 Library @ ^1.2.0
  adafruit/Adafruit NeoPixel @ ^1.12.0
  lewisxhe/PCF8574 library @ ^1.0.0
  bblanchon/ArduinoJson @ ^6.21.0
  Adafruit TinyUSB Library @ ^2.2.0

; ── Desk Sentinel (ESP32-S3) ───────────────────────────────────────
[env:desk-sentinel]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = espidf
build_flags =
  ${common.build_flags}
  -DSS_NODE_DESK=1
  -DSS_NODE_NAME=\"desk-sentinel\"
lib_deps =
  adafruit/Adafruit SSD1306 @ ^2.5.0
  adafruit/Adafruit GFX Library @ ^1.11.0
  adafruit/Adafruit BusIO @ ^1.14.0
  adafruit/Adafruit VL53L1X @ ^1.2.0
  adafruit/Adafruit VEML7700 @ ^2.1.0
  adafruit/Adafruit TCS34725 @ ^1.3.0
  pololu/APDS9306 @ ^1.0.0

; ── Wearable Eye Tag (nRF52840) ───────────────────────────────────
[env:eye-tag]
platform = nordicnrf52@^9.6.0
board = adafruit_feather_nrf52840
framework = arduino
build_flags =
  ${common.build_flags}
  -DSS_NODE_EYETAG=1
  -DSS_NODE_NAME=\"eye-tag\"
  -DNRF52840_XXAA=1
  -DNRF_SDH_BLE_GATT_MAX_MTU_SIZE=247
lib_deps =
  adafruit/Adafruit TMP117 @ ^1.1.0
  adafruit/Adafruit LSM6DS @ ^4.6.0
  adafruit/Adafruit APDS9306 Library @ ^1.0.0
  adafruit/Adafruit BluefruitLE nRF52 @ ^1.4.0

; ── Smart Lamp Node (RP2040) ──────────────────────────────────────
[env:lamp-node]
platform = https://github.com/earlephilhower/arduino-pico/releases/download/3.7.0/platform-raspberrypi-3.7.0.zip
board = pico
framework = arduino
build_flags =
  ${common.build_flags}
  -DSS_NODE_LAMP=1
  -DSS_NODE_NAME=\"lamp-node\"
lib_deps =
  adafruit/Adafruit VEML7700 @ ^2.1.0
  adafruit/Adafruit BusIO @ ^1.14.0
  paulstoffregen/Encoder @ ^1.4.4