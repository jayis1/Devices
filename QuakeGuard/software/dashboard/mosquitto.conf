listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# Bridge to QuakeGuard cloud (optional, for multi-hub setups)
# connection quakeguard-cloud
# address cloud.quakeguard.io:8883
# topic quakeguard/# both 1
# bridge_cafile /mosquitto/certs/ca.crt
# try_duration 30s